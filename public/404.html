<!doctype html>
<html>
  <head>
    <link rel="icon" href="assets/images/favicon.ico" />
    <title>ERRor!??</title>
  </head>
  <body>
    <div class="grid" id="g1"></div>
    <div class="grid" id="g2"></div>

    <div class="box">
      <h1>you found yourself in a strange place...</h1>
      <a href="/">go back?</a>
    </div>
  </body>
  <style>
    @font-face {
      font-family: m5x7;
      src: url(/assets/fonts/m5x7.ttf);
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: m5x7;
      background-color: rgba(187, 4, 185, 1);
    }

    .grid {
      position: fixed;
      background: url("assets/images/components/checker-pattern-128.avif")
        repeat;
      z-index: 0;
      width: 100%;
      height: 100%;
      opacity: 0.7;
    }

    #g1 {
      opacity: 0.2;
    }

    .box {
      z-index: 1;
      background-color: rgba(20, 20, 20, 1);
      padding: 20px;
      border-radius: 4px;
      animation: hovering ease-in-out 7s infinite;
      transition: box-shadow 0.7s ease-in-out;

      &:hover {
        box-shadow: 0 0 10px 15px rgba(198, 20, 196, 0.7);
      }
    }

    h1,
    a {
      color: whitesmoke;
      margin: 0;
    }

    h1 {
      font-size: 49px;
    }

    a {
      font-size: 28px;
      text-decoration: none;
      will-change: opacity;
      animation: flashing linear 3s infinite alternate;
    }

    @keyframes flashing {
      0% {
        opacity: 0.5;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes hovering {
      0% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(10px);
      }
      100% {
        transform: translateY(0);
      }
    }
  </style>
  <script>
    const grid1 = document.getElementById("g1");
    const grid2 = document.getElementById("g2");
    const sleep = (delay) =>
      new Promise((resolve) => setTimeout(resolve, delay));
    const AMOUNT = 1;
    const CAP = 128;

    animateGrid();

    async function animateGrid() {
      let px = 0;
      let py = 0;
      let loops = 0;

      while (true) {
        if (loops == CAP) {
          px = 0;
          py = 0;
          loops = 0;
        }

        px += AMOUNT;
        py += AMOUNT;
        grid1.style.backgroundPosition = `${px}px ${py}px`;
        grid2.style.backgroundPosition = `-${px + 15}px -${py + 35}px`;
        loops += 1;

        await sleep(20);
      }
    }
  </script>
</html>
